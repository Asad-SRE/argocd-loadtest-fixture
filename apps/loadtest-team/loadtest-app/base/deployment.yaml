apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-fixture
spec:
  replicas: 0
  selector:
    matchLabels:
      app: loadtest-fixture
  template:
    metadata:
      labels:
        app: loadtest-fixture
    spec:
      serviceAccountName: loadtest-fixture
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
